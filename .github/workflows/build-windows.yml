name: build-windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@^2

      # 1. 便携 Python + aiperf + WebUI + tokenizer → src-tauri/resources/engine
      - name: Prepare bundled engine
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/prepare_engine.ps1

      # 2. 用即将打包的引擎，对本地 mock LLM 服务跑一次真实 aiperf 压测
      - name: Smoke test (real aiperf run on Windows)
        run: src-tauri/resources/engine/python/python.exe -I scripts/smoke_test.py src-tauri/resources/engine

      - name: Upload smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs
          path: smoke-logs/
          if-no-files-found: ignore

      # 3. 图标 + 安装包
      - name: Generate icons
        run: tauri icon app-icon.svg

      - name: Build NSIS installer
        run: tauri build --bundles nsis

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: AIPerf-Desktop-windows-x64
          path: src-tauri/target/release/bundle/nsis/*.exe
          compression-level: 0

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/nsis/*.exe
