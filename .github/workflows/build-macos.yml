name: build-macos

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos-arm64:
    runs-on: macos-latest   # Apple Silicon (arm64)
    timeout-minutes: 120
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@^2

      - name: Prepare bundled engine
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/prepare_engine.sh

      - name: Smoke test (real aiperf run on macOS arm64)
        run: src-tauri/resources/engine/python/bin/python3 -I -X utf8 scripts/smoke_test.py src-tauri/resources/engine

      - name: Upload smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs-macos
          path: smoke-logs/
          if-no-files-found: ignore

      - name: Generate icons
        run: tauri icon app-icon.svg

      - name: Build app + dmg
        run: tauri build --bundles app,dmg

      - name: Verify bundle
        run: |
          APP="src-tauri/target/release/bundle/macos/AIPerf Desktop.app"
          codesign --verify --verbose=2 "$APP" || true
          ls -la "$APP/Contents/Resources/engine/python/bin/" | head
          "$APP/Contents/Resources/engine/python/bin/python3" -c "import aiperf, numpy; print('bundled python OK', numpy.__version__)"
          ls -la src-tauri/target/release/bundle/dmg/

      - name: Upload dmg
        uses: actions/upload-artifact@v4
        with:
          name: AIPerf-Desktop-macos-arm64
          path: src-tauri/target/release/bundle/dmg/*.dmg
          compression-level: 0

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/dmg/*.dmg
