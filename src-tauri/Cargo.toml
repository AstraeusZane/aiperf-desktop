[package]
name = "aiperf-desktop"
version = "0.1.0"
description = "AIPerf 压测可视化 - 本地离线桌面客户端"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
dunce = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
